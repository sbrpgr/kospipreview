name: retrain-model

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    # Daily model artifact rebuild after KRX close. Near-live data remains owned by Cloud Run.
    - cron: "17 8 * * 1-5"

concurrency:
  group: retrain-model-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: kospipreview

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: kospipreview

      - name: Seed current JSON from Cloud Storage
        run: |
          shopt -s nullglob
          mkdir -p .live-data-seed/bundled .live-data-seed/bucket frontend/public/data
          cp frontend/public/data/prediction_archive.json .live-data-seed/bundled/prediction_archive.json || true
          if ! gcloud storage cp \
            "gs://kospipreview-live-data/*.json" \
            .live-data-seed/bucket/ \
            --quiet; then
            echo "::warning::Cloud Storage seed copy was incomplete; continuing with files copied plus bundled fallbacks."
          fi
          bucket_json=(.live-data-seed/bucket/*.json)
          if [ ${#bucket_json[@]} -gt 0 ]; then
            cp "${bucket_json[@]}" frontend/public/data/
          else
            echo "::error::No Cloud Storage JSON seed files were copied; refusing to publish bundled live data."
            exit 1
          fi
          if [ ! -f .live-data-seed/bucket/live_prediction_series.json ]; then
            echo "::error::Missing live_prediction_series.json seed; refusing to overwrite prediction trend history."
            exit 1
          fi
          python ./scripts/merge_live_data_seed.py \
            --archive-fallback .live-data-seed/bundled/prediction_archive.json \
            --archive-bucket .live-data-seed/bucket/prediction_archive.json \
            --archive-output frontend/public/data/prediction_archive.json

      - name: Rebuild model artifacts
        run: python ./scripts/backtest_and_generate.py

      - name: Refresh night futures and live prediction series
        run: python ./scripts/refresh_night_futures.py

      - name: Preserve existing prediction snapshot
        run: |
          python ./scripts/merge_live_data_seed.py \
            --prediction-fallback .live-data-seed/bucket/prediction.json \
            --prediction-output frontend/public/data/prediction.json \
            --prediction-series frontend/public/data/live_prediction_series.json

      - name: Preserve existing history verification fields
        run: |
          python ./scripts/merge_live_data_seed.py \
            --history-fallback .live-data-seed/bucket/history.json \
            --history-output frontend/public/data/history.json

      - name: Guard live JSON publish
        run: |
          python ./scripts/guard_live_json_publish.py \
            --data-dir frontend/public/data \
            --seed-dir .live-data-seed/bucket \
            --scope primary

      - name: Publish generated JSON to Cloud Storage
        run: |
          publish_files=(
            prediction.json
            indicators.json
            history.json
            live_prediction_series.json
            backtest_diagnostics.json
            day_futures_close_cache.json
            night_futures_source_cache.json
            prediction_archive.json
          )
          for file_name in "${publish_files[@]}"; do
            source_path="frontend/public/data/${file_name}"
            if [ ! -f "$source_path" ]; then
              echo "::error::Missing required primary publish artifact: $file_name"
              exit 1
            fi
            gcloud storage cp \
              "$source_path" \
              "gs://kospipreview-live-data/$file_name" \
              --cache-control=no-store \
              --content-type="application/json; charset=utf-8" \
              --quiet
          done
          if [ -d frontend/public/data/intraday_indicator_series ]; then
            gcloud storage cp \
              frontend/public/data/intraday_indicator_series \
              gs://kospipreview-live-data/ \
              --recursive \
              --cache-control=no-store \
              --content-type="application/json; charset=utf-8" \
              --quiet
          fi
